<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: linear-gradient(135deg, #0f172a, #020617); color: #f8fafc; }

    header {
      text-align: center;
      padding: 20px;
      background: #020617;
      box-shadow: 0 0 15px rgba(56,189,248,0.3);
    }

    header h1 { margin: 0; color: #38bdf8; }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: #020617;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 15px rgba(56,189,248,0.15);
    }

    .card h3 { margin: 0; color: #38bdf8; }
    .card p { font-size: 22px; font-weight: bold; margin: 10px 0 0; }

    .income { color: #22c55e; }
    .expense { color: #ef4444; }
    .balance { color: #facc15; }

    .form-box {
      background: #020617;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(56,189,248,0.15);
      margin-bottom: 25px;
    }

    .form-box h2 { margin-top: 0; color: #38bdf8; }

    .form-group { margin-bottom: 15px; }

    .form-group label { display: block; margin-bottom: 5px; }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    button {
      background: #38bdf8;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    button:hover { background: #0ea5e9; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #020617;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(56,189,248,0.15);
    }

    th, td { padding: 12px; text-align: center; }
    th { background: #020617; color: #38bdf8; }
    tr:nth-child(even) { background: #1e293b; }

    .delete-btn {
      background: #ef4444;
      border: none;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      color: white;
    }

    footer {
      text-align: center;
      padding: 15px;
      margin-top: 30px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<header>
  <h1>💰 Expense Tracker Web App</h1>
</header>

<div class="container">

  <div class="summary">
    <div class="card">
      <h3>Total Income</h3>
      <p class="income" id="income">₹0</p>
    </div>
    <div class="card">
      <h3>Total Expense</h3>
      <p class="expense" id="expense">₹0</p>
    </div>
    <div class="card">
      <h3>Balance</h3>
      <p class="balance" id="balance">₹0</p>
    </div>
  </div>

  <div class="form-box">
    <h2>Add Transaction</h2>
    <div class="form-group">
      <label>Description</label>
      <input type="text" id="desc" placeholder="Enter description">
    </div>
    <div class="form-group">
      <label>Amount</label>
      <input type="number" id="amount" placeholder="Enter amount">
    </div>
    <div class="form-group">
      <label>Type</label>
      <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
    </div>
    <button onclick="addTransaction()">Add Transaction</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Description</th>
        <th>Amount</th>
        <th>Type</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

</div>

<footer>
  Expense Tracker | Mini Web Project
</footer>

<script>
  let transactions = [];

  function addTransaction() {
    const desc = document.getElementById("desc").value;
    const amount = Number(document.getElementById("amount").value);
    const type = document.getElementById("type").value;

    if (!desc || !amount) {
      alert("Please fill all fields");
      return;
    }

    transactions.push({ desc, amount, type });

    document.getElementById("desc").value = "";
    document.getElementById("amount").value = "";

    updateUI();
  }

  function deleteTransaction(index) {
    transactions.splice(index, 1);
    updateUI();
  }

  function updateUI() {
    const tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "";

    let totalIncome = 0;
    let totalExpense = 0;

    transactions.forEach((t, index) => {
      const row = `<tr>
        <td>${t.desc}</td>
        <td>₹${t.amount}</td>
        <td>${t.type}</td>
        <td><button class="delete-btn" onclick="deleteTransaction(${index})">Delete</button></td>
      </tr>`;

      tableBody.innerHTML += row;

      if (t.type === "income") totalIncome += t.amount;
      else totalExpense += t.amount;
    });

    document.getElementById("income").innerText = `₹${totalIncome}`;
    document.getElementById("expense").innerText = `₹${totalExpense}`;
    document.getElementById("balance").innerText = `₹${totalIncome - totalExpense}`;
  }
</script>

</body>
</html>
